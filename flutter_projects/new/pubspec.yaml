name: agri_advisor
description: A Smart Agriculture Advisor App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌍 Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.6

  # 🌐 Networking
  http: ^1.2.1

  # 💾 Local storage
  shared_preferences: ^2.2.2

  # 📷 Image picker
  image_picker: ^1.0.7

  # 🎤 Voice features
  speech_to_text: ^7.3.0
  flutter_tts: ^3.6.3

  # 📊 Charts
  fl_chart: ^0.66.0

  # 📍 Location
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ✅ REQUIRED FOR TRANSLATION
  generate: true

  assets:
    - assets/